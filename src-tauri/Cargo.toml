[package]
name = "foldersync"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "7"
dunce = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
windows-registry = "0.6.1"
tauri-plugin-single-instance = "2"
foldersync-engine = { path = "../crates/sync-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
windows = { version = "0.62.2", features = ["UI_Notifications"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }
tauri-plugin-updater = "2.14.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

